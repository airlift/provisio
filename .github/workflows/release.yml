name: Release new version

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to retry publishing (leave blank for a new release)'
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check if release is running from master
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "Release is only allowed from master branch"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master

      - name: Install java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          gpg-private-key: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          cache: 'maven'

      - name: Configure git
        run: |
          git config user.name "Airlift Release"
          git config user.email "airlift-bot@airlift.io"

      - name: Run mvn release:prepare
        if: inputs.release_tag == ''
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: |
          ./mvnw -B -Pgithub-release release:prepare

      - name: Determine release version
        if: inputs.release_tag == ''
        run: |
          export VERSION=$(grep 'scm.tag=' release.properties | cut -d'=' -f2)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Releasing version: ${VERSION}"

      - name: Run mvn release:perform to local staging
        if: inputs.release_tag == ''
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: |
          ./mvnw -B -s .mvn/release-settings.xml -Pgithub-release release:perform

      - name: Restage artifacts from an existing release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^provisio-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a Provisio release tag such as provisio-2.1.0"
            exit 1
          fi
          git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}" HEAD
          git checkout --detach "refs/tags/${RELEASE_TAG}"
          echo "VERSION=${RELEASE_TAG}" >> "$GITHUB_ENV"
          ./mvnw -B -s .mvn/release-settings.xml -Ptakari-release,github-release deploy

      - name: Run njord:validate
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_NEXUS2_MAVEN_CENTRAL_USERNAME }}
          MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_NEXUS2_MAVEN_CENTRAL_TOKEN }}
        run: |
          ./mvnw -B -s .mvn/release-settings.xml -Ptakari-release njord:list
          ./mvnw -B -s .mvn/release-settings.xml -Ptakari-release njord:status
          ./mvnw -B -s .mvn/release-settings.xml -Ptakari-release njord:validate

      - name: Push git changes
        if: inputs.release_tag == ''
        run: |
          git status
          git describe
          git push --atomic origin HEAD:refs/heads/master "refs/tags/${VERSION}"

      - name: Run njord:publish
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_NEXUS2_MAVEN_CENTRAL_USERNAME }}
          MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_NEXUS2_MAVEN_CENTRAL_TOKEN }}
        run:
          ./mvnw -B -s .mvn/release-settings.xml -Ptakari-release njord:publish

      - name: Create release notes
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          gh release create "${VERSION}" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${GITHUB_REPOSITORY#*/} ${VERSION}" \
              --generate-notes
